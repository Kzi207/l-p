name: Kiểm tra thư tới ngày mở

on:
  schedule:
    # 01:00 UTC = 08:00 sáng tại Việt Nam.
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  notify-timecapsules:
    runs-on: ubuntu-latest
    steps:
      - name: Đánh thức Render Free
        run: |
          curl --location --max-time 65 "${{ secrets.RENDER_APP_URL }}/api/health" || true
          sleep 50

      - name: Gọi API kiểm tra Hộp thư
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors --retry-delay 10 --max-time 90 --request POST \
            --header "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.RENDER_APP_URL }}/api/notify/timecapsule-check"
